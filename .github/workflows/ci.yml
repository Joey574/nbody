name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: ubuntu (${{ matrix.backend }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: headless
            packages: ""
            cmake_args: -DGLFW_BUILD_X11=OFF -DGLFW_BUILD_WAYLAND=OFF

          - backend: x11
            packages: >-
              libx11-dev libxrandr-dev libxinerama-dev
              libxcursor-dev libxi-dev libxext-dev
            cmake_args: -DGLFW_BUILD_WAYLAND=OFF

          - backend: wayland
            packages: >-
              libwayland-dev libxkbcommon-dev wayland-protocols
              extra-cmake-modules
            cmake_args: -DGLFW_BUILD_X11=OFF

          - backend: x11+wayland
            packages: >-
              libx11-dev libxrandr-dev libxinerama-dev
              libxcursor-dev libxi-dev libxext-dev
              libwayland-dev libxkbcommon-dev wayland-protocols
              extra-cmake-modules
            cmake_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ${{ matrix.packages }}

      - name: Configure
        run: |
          cmake -B build \
            -DFETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-libgomp

      - name: Configure
        run: |
          cmake -B build \
            -DFETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-15
    timeout-minutes: 10

    env:
      CC: /usr/bin/clang
      CXX: /usr/bin/clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libomp

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix libomp)" \
            -DFETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
